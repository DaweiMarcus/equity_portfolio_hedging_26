[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-portfolio-hedge"
version = "0.1.0"
description = "Equity portfolio beta analysis and hedging tool"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "plotly>=5.14",
]

[project.scripts]
portfolio-hedge = "src.cli:main"

[project.gui-scripts]
portfolio-hedge-gui = "src.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
